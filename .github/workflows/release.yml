name: Release

on:
  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run Release Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI-Anti-Spam-Bot ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 🚀 AI-Anti-Spam-Bot ${{ github.ref_name }}

            ### 📦 Docker
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### 🔄 Quick Upgrade
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
            docker compose up -d
            ```

            ### 🐞 Feedback
            If you hit any regression or have feature suggestions, please open an issue:
            https://github.com/${{ github.repository }}/issues

            ---

            GitHub auto-generated release notes are included below.

  telegram:
    name: Announce to Telegram Channel
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Send channel announcement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          dockerhub_username = os.environ["DOCKERHUB_USERNAME"]
          docker_image_name = os.environ["DOCKER_IMAGE_NAME"]
          release_url = f"https://github.com/{repo}/releases/tag/{version}"
          issues_url = f"https://github.com/{repo}/issues"
          repo_url = f"https://github.com/{repo}"

          message = (
              f"<b>\U0001f389 AI-Anti-Spam-Bot \u53d1\u5e03\u65b0\u7248\u672c</b>\n\n"
              f"<b>\U0001f3f7 \u7248\u672c\uff1a</b><code>{version}</code>\n"
              "#AI\u53cd\u5783\u573e\u673a\u5668\u4eba\u7248\u672c\u53d1\u5e03\n\n"
              f"<b>\U0001f4e6 Docker\uff1a</b>\n"
              f"<code>docker pull {dockerhub_username}/{docker_image_name}:{version}</code>\n\n"
              f"<b>\U0001f50d \u66f4\u65b0\u8be6\u60c5\uff1a</b>\n"
              f"<a href=\"{release_url}\">\u67e5\u770b Release</a>\n\n"
              f"<b>\U0001f41e \u95ee\u9898\u53cd\u9988\uff1a</b>\n"
              f"<a href=\"{issues_url}\">\u63d0\u4ea4 Issue</a>\n\n"
              f"<b>\U0001f4e6 \u9879\u76ee\u5730\u5740\uff1a</b>\n"
              f"<a href=\"{repo_url}\">GitHub \u4ed3\u5e93</a>"
          )

          payload = urllib.parse.urlencode(
              {
                  "chat_id": os.environ["TELEGRAM_CHANNEL_ID"],
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          with urllib.request.urlopen(url, data=payload) as response:
              print(response.read().decode("utf-8"))
          PY
