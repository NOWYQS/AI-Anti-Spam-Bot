services:
  bot:
    image: ${AI_ANTISPAM_IMAGE:-ai-anti-spam-bot:local}
    build:
      context: .
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
        org.opencontainers.image.source: https://github.com/NOWYQS/AI-Anti-Spam-Bot
    container_name: ai-anti-spam-bot
    restart: unless-stopped
    env_file:
      - ${BOT_ENV_FILE:-.env}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
