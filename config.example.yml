# Telegram 配置
telegram:
  token: "your-bot-token"
  owners: ["your-telegram-id"]  # 超级管理员ID（可管理广告）
  allow_any_group: true
  groups: []

# 语言设置 (zh / en)
language: "zh"

# AI 模型选择: openai / qwen / deepseek
ai_model: "openai"

# OpenAI 配置。生产环境可用 OPENAI_API_KEY / OPENAI_BASE_URL /
# OPENAI_MODEL 环境变量覆盖，避免把凭据写入配置文件。
openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"

# 通义千问配置
qwen:
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-vl-max"

# DeepSeek 配置
deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"

# 检测策略（增强版）
strategy:
  joined_days: 3              # 加入天数阈值
  min_messages: 3             # 最少发言次数
  spam_score: 80              # 垃圾评分阈值 (0-100)
  verification_times: 1       # 验证通过次数限制（0=不限制，>0=通过N次后不再检测）
  check_message_count: true   # 是否检查发言次数（false=只看加入天数）

# 新成员公开资料审核：加入后不预先限制，只有明确广告资料才禁言。
new_member_review:
  enabled: true
  mute_score: 97
  timeout_seconds: 20
  delete_notice_after_seconds: 0

# 消息管理
message:
  ban_notice_template: |
    \#封禁预警
    [{masked_name}]({user_link}) 请注意，你的用户名或发言存在违规
    ⚠️已被AI判断为高风险用户，永久封禁
    风险分数：{score}
    📋 违规原因：
    ```
    {reason}
    ```
    🤖 AI 嘲讽：
    ```
    {mock}
    ```
  delete_ban_notice_after_seconds: 30      # 封禁通知自动删除秒数，0=不自动删除
  delete_welcome_message_after_seconds: 30 # 欢迎消息自动删除秒数，0=不自动删除

# 数据库
database:
  path: "data/bot.db"
